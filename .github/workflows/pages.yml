name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege: every job reads only; the deploy job alone may publish (security review, 2026-10-24).
permissions:
  contents: read

# Pull requests get their own group: sharing "pages" let a queued PR run cancel a pending master deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        working-directory: web
        # the Python tests (bake QA, packaging) read images and atlases with numpy and Pillow
        run: |
          npm ci
          python -m pip install --quiet numpy pillow
      - name: Lint
        working-directory: web
        run: npm run lint --if-present
      - name: Tests
        working-directory: web
        # GitHub's runners are 2-4x slower than a desktop: the shader goldens take ~40 s locally and passed 120 s here
        run: npm test -- --timeout=600

  # The UI smoke tests (gate d, web/tools/smoke) do not run here: in software WebGL on GitHub's 4-core runners the
  # house alone takes over 7 minutes to load, so the job could only time out. They run on a GPU instead, after every
  # bake and before pushing UI changes (bake/validate/RENDER_GATE.md).

  # Build in a job without publishing rights (npm ci runs install scripts), then hand the artifact to a deploy job
  # that holds only the Pages and OIDC permissions.
  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the walkthrough
        working-directory: web
        run: |
          npm ci
          node tools/build.mjs --min
      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude node_modules --exclude tools web/ _site/
          rm -rf _site/assets/photos _site/assets/panos
          cp -a source/zillow/gallery _site/assets/photos
          cp -a source/zillow/panos _site/assets/panos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
