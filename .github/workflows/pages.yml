name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint --if-present
      - name: Tests
        working-directory: web
        run: npm test

  # UI smoke tests (gate d, web/tools/smoke): the house in headless Chromium on software WebGL2.
  # Non-blocking for now: it has not run on CI yet. Once it has been green there, make it blocking by removing
  # continue-on-error and adding smoke to the deploy job's needs.
  smoke:
    needs: [test]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build the walkthrough
        working-directory: web
        run: node tools/build.mjs
      - name: UI smoke tests
        working-directory: web
        run: node tools/smoke/run.mjs --out=smoke-artifacts
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: web/smoke-artifacts
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the walkthrough
        working-directory: web
        run: |
          npm ci
          node tools/build.mjs --min
      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude node_modules --exclude tools web/ _site/
          rm -rf _site/assets/photos _site/assets/panos
          cp -a source/zillow/gallery _site/assets/photos
          cp -a source/zillow/panos _site/assets/panos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
